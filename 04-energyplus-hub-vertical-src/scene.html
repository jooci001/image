<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>에너지플러스 허브 세로 540×1650</title>
<style>
@font-face{font-family:"Pretendard";src:url(fonts/PretendardVariable.ttf) format("truetype");font-weight:100 900}
:root{--navy:#121E2A;--mint:#42DE8A;--mint2:#2FC777;--gsblue:#0066B3;--gsorange:#F08300;--gsgreen:#78B74B}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:540px;height:1650px;overflow:hidden;font-family:"Pretendard","Noto Color Emoji",sans-serif;color:#fff;background:var(--navy)}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#0B141D 0%,#121E2A 25%,#16283A 50%,#1B3348 64%,#1E4646 80%,#2A6A57 100%)}
.glow{position:absolute;border-radius:50%;pointer-events:none}
#glowT{left:270px;top:545px;width:900px;height:900px;margin:-450px 0 0 -450px;background:radial-gradient(circle,rgba(66,222,138,.17),rgba(66,222,138,0) 60%)}
#glowB{left:270px;top:1560px;width:1000px;height:1000px;margin:-500px 0 0 -500px;background:radial-gradient(circle,rgba(66,222,138,.20),rgba(42,106,87,0) 62%)}
.plus{position:absolute;width:20px;height:20px}
.plus:before,.plus:after{content:"";position:absolute;background:rgba(66,222,138,.85);border-radius:2px}
.plus:before{left:40%;top:0;width:20%;height:100%}.plus:after{top:40%;left:0;height:20%;width:100%}
/* GS Caltex logo card: very top, centred */
#badge{position:absolute;left:270px;top:40px;margin-left:-210px;width:420px;height:130px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 34px rgba(0,0,0,.45)}
#badge img{width:330px;height:96px}
/* message (in the former '오늘 하루도 파이팅하세요!' slot) */
.line{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.03em;line-height:1;white-space:nowrap;text-shadow:0 4px 0 rgba(0,0,0,.28),0 10px 22px rgba(0,0,0,.35)}
.g{color:var(--mint)}
.gloss{text-shadow:none;pointer-events:none}
.gl{color:transparent;background-image:linear-gradient(105deg,rgba(255,255,255,0) 44%,rgba(240,255,248,.78) 50%,rgba(255,255,255,0) 56%);background-size:250% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;background-position:100% 0}
#e1{display:inline-block;font-size:.74em;margin-left:.12em;vertical-align:.06em;text-shadow:none}
/* station: full-width canopy with the energy plus wordmark, pillars */
#canopy{position:absolute;left:-10px;width:560px;top:880px;height:110px}
#canopy .roof{position:absolute;left:0;right:0;top:0;height:96px;background:#FFFFFF;border-bottom:6px solid #E3ECE7;border-radius:0 0 22px 22px;box-shadow:0 12px 26px rgba(0,0,0,.38)}
#canopy .sign{position:absolute;left:10px;width:540px;top:11px;display:flex;justify-content:center}
#canopy .sign img{width:380px;height:74px}
#canopy .led{position:absolute;left:10px;top:108px;height:6px;width:0;border-radius:3px;background:linear-gradient(90deg,var(--mint2),var(--mint),var(--mint2));box-shadow:0 0 12px var(--mint)}
.pillar{position:absolute;top:1000px;width:22px;height:700px;background:linear-gradient(90deg,#0E1822,#24384C 50%,#0E1822);border-radius:4px}
.pillar i{position:absolute;left:8px;top:16px;width:6px;bottom:16px;border-radius:3px;background:linear-gradient(180deg,var(--mint),var(--mint2));opacity:.9;box-shadow:0 0 8px var(--mint)}
/* character (upper body; legs continue below the frame) */
#char{position:absolute;left:-12px;top:1142.5px;width:565.25px;height:845.25px;transform-origin:50% 60.45%}
#char img{position:absolute;left:0;top:0;width:100%;height:100%}
#arm{transform-origin:28.793% 43.064%}
.wv{position:absolute;width:34px;height:6px;border-radius:3px;background:var(--mint);opacity:0}
#bfade{position:absolute;left:0;right:0;top:1580px;height:70px;background:linear-gradient(180deg,rgba(14,24,34,0),rgba(14,24,34,.5))}
.cf{position:absolute;width:15px;height:7px;border-radius:2px}
</style></head><body>
<div id="bg"></div><div class="glow" id="glowT"></div><div class="glow" id="glowB"></div><div id="parts"></div>
<div id="badge"><img src="img/logo_gs_2x.png" alt="GS칼텍스"></div>

<div class="line" id="l4" style="top:448px;font-size:78px"><span class="g">에너지플러스</span>가</div>
<div class="line gloss" id="l4g" style="top:448px;font-size:78px"><span class="gl" id="gl">에너지플러스</span><span style="visibility:hidden">가</span></div>
<div class="line" id="l5" style="top:546px;font-size:90px">응원합니다<span id="e1">💚</span></div>

<div class="pillar" id="pl" style="left:8px"><i></i></div>
<div class="pillar" id="pr" style="left:510px"><i></i></div>
<div id="canopy"><div class="roof"></div><div class="sign"><img src="img/logo_ep_h.png" alt="energy plus"></div><div class="led" id="led"></div></div>
<div id="wv"></div>
<div id="char"><img id="arm" src="img/arm4b.png"><img id="body" src="img/body4b.png"></div>
<div id="bfade"></div>
<div id="conf"></div>

<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const P=Array.from({length:30},()=>({x:rnd()*540,y:rnd()*1700,s:9+rnd()*14,v:25+rnd()*45,ph:rnd()*6.28,a:.18+rnd()*.42,r:rnd()*90}));
$('parts').innerHTML=P.map((p,i)=>`<div class="plus" id="p${i}" style="width:${p.s}px;height:${p.s}px"></div>`).join('');
$('wv').innerHTML=[0,1,2].map(i=>`<div class="wv" id="w${i}"></div>`).join('');
const CC=['#FFFFFF','#42DE8A','#0066B3','#F08300','#78B74B'];
const C=Array.from({length:80},()=>({x:270+(rnd()-.5)*140,y:1440,vx:(rnd()-.5)*700,vy:-(450+rnd()*500),rot:rnd()*360,vr:(rnd()-.5)*900,c:CC[Math.floor(rnd()*CC.length)]}));
$('conf').innerHTML=C.map((c,i)=>`<div class="cf" id="c${i}" style="background:${c.c}"></div>`).join('');
function pop(el,t,a,{d=.7,dy=34}={}){const p=cl((t-a)/d);el.style.opacity=cl((t-a)/.25);el.style.transform=`translateY(${dy*(1-eo(p))}px) scale(${.4+.6*back(p)})`;}
// downward-only spring dip (the cut below the belt never shows)
function hop(t,a){const x=(t-a)/.6; return (x>0&&x<1)? 28*Math.sin(Math.PI*x)*Math.exp(-2*x):0;}
function render(t){
  $('glowT').style.transform=`scale(${1+.05*Math.sin(t*2)})`;
  $('glowB').style.transform=`scale(${1+.04*Math.sin(t*2+1)})`;
  P.forEach((p,i)=>{const y=((p.y-p.v*t)%1720+1720)%1720-40, x=p.x+10*Math.sin(t*1.2+p.ph);
    const e=$('p'+i); e.style.transform=`translate(${x}px,${y}px) rotate(${p.r+t*40}deg)`; e.style.opacity=p.a*cl(t/.8);});
  // GS Caltex logo card
  pop($('badge'),t,.2,{dy:-20});
  // station
  ['pl','pr'].forEach(id=>{$(id).style.opacity=cl((t-.2)/.6);});
  $('canopy').style.opacity=cl((t-.1)/.5);
  $('led').style.width=(540*eo((t-.4)/1.4))+'px';
  $('led').style.filter=`brightness(${1+.4*Math.max(0,Math.sin(t*3))})`;
  // message: 에너지플러스가 / 응원합니다 💚
  pop($('l4'),t,1.0); $('l4g').style.transform=$('l4').style.transform; $('l4g').style.opacity=$('l4').style.opacity;
  pop($('l5'),t,1.5,{d:.8});
  $('l5').style.transform+=` scale(${1+.02*Math.max(0,Math.sin((t-2.6)*5))*cl(t-2.6)})`;
  pop($('e1'),t,2.0,{dy:0}); $('e1').style.transform+=` scale(${1+.12*Math.max(0,Math.sin(t*7))})`;
  // gloss sweep across 에너지플러스
  const sw=s=>cl((t-s)/.9); const g=t<6.5? sw(4.2):sw(8.6);
  $('gl').style.backgroundPosition=`${100-100*eio(g)}% 0`;
  // character: rise in, breathe, waving, two spring dips (3.4s, 7.6s)
  const rise=eo((t-.5)/.9), squash=1+.06*Math.sin(Math.PI*cl((t-1.2)/.35))*(t>1.2&&t<1.55?1:0);
  const bob=Math.sin(t*3.2)*3.2, br=1+.012*Math.sin(t*3.2);
  const hy=hop(t,3.4)+hop(t,7.6);
  $('char').style.opacity=cl((t-.5)/.3);
  $('char').style.transform=`translateY(${(1-rise)*600+Math.abs(bob)+hy}px) scale(${br*(2-squash)},${br*squash}) rotate(${1.2*Math.sin(t*1.6)}deg)`;
  const wa=cl((t-1.0)/.4), amp=7*(t<2.6?1:.7);
  $('arm').style.transform=`rotate(${wa*amp*Math.sin((t-1.0)*2*Math.PI*1.6)}deg)`;
  // motion marks beside the waving hand
  [0,1,2].forEach(i=>{const e=$('w'+i), ph=(t*1.6+i*.33)%1; const on=t>1.1&&t<2.8;
    e.style.opacity=on? .85*Math.sin(Math.PI*ph):0;
    e.style.transform=`translate(${46-3*i}px,${1284+18*i}px) rotate(${-35+20*i}deg) scaleX(${.8+.8*ph})`;});
  // confetti with the second dip
  const ct=t-7.6;
  C.forEach((c,i)=>{const e=$('c'+i); if(ct<0){e.style.opacity=0;return;}
    const x=c.x+c.vx*ct, y=c.y+c.vy*ct+700*ct*ct; e.style.opacity=cl(1-(ct-1.6)/.5);
    e.style.transform=`translate(${x}px,${y}px) rotate(${c.rot+c.vr*ct}deg)`;});
}
window.render=render; render(0);
</script>
</body></html>
