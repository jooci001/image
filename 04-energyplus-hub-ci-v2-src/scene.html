<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>에너지플러스 허브 응원 10s</title>
<style>
@font-face{font-family:"Pretendard";src:url(fonts/PretendardVariable.ttf) format("truetype");font-weight:100 900}
:root{--navy:#121E2A;--navy2:#1B2C3E;--mint:#42DE8A;--mint2:#2FC777;--gsblue:#0066B3;--gsorange:#F08300;--gsgreen:#78B74B;--g2:#121E2A;--g3:#42DE8A;--lime:#42DE8A}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:5402px;overflow:hidden;font-family:"Pretendard","Noto Color Emoji",sans-serif;color:#fff;background:var(--navy)}
#bg{position:absolute;inset:0;background:linear-gradient(180deg,#0B141D 0%,#121E2A 25%,#16283A 50%,#1B3348 64%,#1E4646 78%,#2A6A57 100%)}
#glow{position:absolute;left:960px;top:1150px;width:2400px;height:2400px;margin:-1200px 0 0 -1200px;border-radius:50%;background:radial-gradient(circle,rgba(66,222,138,.28),rgba(66,222,138,0) 60%)}
.plus{position:absolute;width:60px;height:60px}
.plus:before,.plus:after{content:"";position:absolute;background:rgba(66,222,138,.85);border-radius:6px}
.plus:before{left:40%;top:0;width:20%;height:100%}.plus:after{top:40%;left:0;height:20%;width:100%}
/* hub canopy */
#canopy{position:absolute;left:-60px;width:2040px;top:3240px;height:360px}
#canopy .roof{position:absolute;left:0;right:0;top:0;height:320px;background:#FFFFFF;border-bottom:14px solid #E3ECE7;border-radius:0 0 40px 40px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
#canopy .led{position:absolute;left:60px;top:338px;height:16px;width:0;border-radius:8px;background:linear-gradient(90deg,var(--g3),var(--lime),var(--g3));box-shadow:0 0 30px var(--lime)}
#canopy .sign{position:absolute;left:0;right:0;top:40px;display:flex;justify-content:center}#canopy .sign img{width:1237px;height:239px}
#canopy .sign b{color:var(--g3)}
.pillar{position:absolute;top:3600px;width:90px;height:1900px;background:linear-gradient(90deg,#0E1822,#24384C 50%,#0E1822);border-radius:10px}
.pillar i{position:absolute;left:36px;top:60px;width:18px;bottom:60px;border-radius:9px;background:linear-gradient(180deg,var(--mint),var(--mint2));opacity:.9;box-shadow:0 0 24px var(--mint)}
#floor{position:absolute;left:0;right:0;top:5010px;bottom:0;background:linear-gradient(180deg,#CFEBDD,#EAF7F0)}
#floor:before{content:"";position:absolute;left:0;right:0;top:0;height:14px;background:var(--mint)}
#strip{position:absolute;left:0;right:0;top:5110px;display:flex;align-items:center;justify-content:center;gap:34px;font-size:66px;font-weight:800;letter-spacing:.06em;color:var(--navy)}#strip img{height:150px}
.line{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-.03em;line-height:1;white-space:nowrap;text-shadow:0 12px 0 rgba(0,0,0,.28),0 30px 60px rgba(0,0,0,.35)}
.emo{position:absolute;font-size:220px;line-height:1}
#badge{position:absolute;left:960px;top:240px;margin-left:-640px;width:1280px;height:460px;border-radius:70px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 30px 80px rgba(0,0,0,.45)}#badge img{width:990px;height:288px}
#badge .dot{width:110px;height:110px;border-radius:50%;background:var(--g3);color:#fff;display:flex;align-items:center;justify-content:center;font-size:96px;font-weight:900;line-height:1}
#char{position:absolute;left:257px;top:4130px;width:1405px;height:2101px;transform-origin:702px 1270px}
#char img{position:absolute;left:0;top:0;width:1405px;height:2101px}
#arm{transform-origin:426px 931px}
#shadow{position:absolute;left:560px;top:4930px;width:800px;height:120px;border-radius:50%;background:radial-gradient(ellipse,rgba(0,60,30,.35),rgba(0,60,30,0) 70%)}
#bubble{position:absolute;left:1230px;top:3900px;width:620px;height:300px;background:#fff;border-radius:150px;color:var(--navy);font-size:130px;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 24px 50px rgba(0,50,25,.3)}
#bubble:after{content:"";position:absolute;left:110px;bottom:-60px;border:40px solid transparent;border-top:70px solid #fff;border-left-width:20px}
.wv{position:absolute;width:120px;height:20px;border-radius:8px;background:#42DE8A;opacity:0}
.cf{position:absolute;width:46px;height:22px;border-radius:6px}
</style></head><body>
<div id="bg"></div><div id="glow"></div><div id="parts"></div>
<div id="badge"><img src="img/logo_gs_top.png"></div>

<div class="line" id="l1" style="top:980px;font-size:320px">안녕하세요!</div>
<div class="line" id="l2" style="top:1560px;font-size:230px">오늘 하루도</div>
<div class="line" id="l3" style="top:1850px;font-size:280px;color:var(--mint)">파이팅하세요!</div>
<div class="line" id="l4" style="top:2400px;font-size:220px">에너지플러스가</div>
<div class="line" id="l5" style="top:2670px;font-size:270px">응원합니다</div>
<div class="emo" id="e1" style="left:1570px;top:2690px">💚</div>

<div class="pillar" id="pl" style="left:150px"><i></i></div>
<div class="pillar" id="pr" style="left:1680px"><i></i></div>
<div id="canopy"><div class="roof"></div><div class="sign"><img src="img/logo_ep_h.png"></div><div class="led" id="led"></div></div>


<div id="wv"></div>
<div id="char"><img id="body" src="img/body.png"><img id="arm" src="img/arm.png"></div>
<div id="bubble">파이팅!</div>
<div id="bfade" style="position:absolute;left:0;right:0;top:5200px;height:202px;background:linear-gradient(180deg,rgba(18,30,42,0),rgba(18,30,42,.55))"></div>
<div id="conf"></div>

<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.max(0,Math.min(1,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const back=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
const P=Array.from({length:46},()=>({x:rnd()*1920,y:rnd()*3000,s:30+rnd()*50,v:120+rnd()*260,ph:rnd()*6.28,a:.2+rnd()*.45,r:rnd()*90}));
$('parts').innerHTML=P.map((p,i)=>`<div class="plus" id="p${i}" style="width:${p.s}px;height:${p.s}px"></div>`).join('');
$('wv').innerHTML=[0,1,2].map(i=>`<div class="wv" id="w${i}"></div>`).join('');
const CC=['#FFFFFF','#42DE8A','#0066B3','#F08300','#78B74B'];
const C=Array.from({length:120},()=>({x:960+(rnd()-.5)*500,y:4000,vx:(rnd()-.5)*2800,vy:-(1500+rnd()*2400),rot:rnd()*360,vr:(rnd()-.5)*900,c:CC[Math.floor(rnd()*CC.length)]}));
$('conf').innerHTML=C.map((c,i)=>`<div class="cf" id="c${i}" style="background:${c.c}"></div>`).join('');
function pop(el,t,a,{d=.7,dy=120}={}){const p=cl((t-a)/d);el.style.opacity=cl((t-a)/.25);el.style.transform=`translateY(${dy*(1-eo(p))}px) scale(${.4+.6*back(p)})`;}
function hop(t,a){const x=(t-a)/.6; return (x>0&&x<1)? 70*Math.sin(Math.PI*x)*Math.exp(-2*x):0;}
function render(t){
  $('glow').style.transform=`scale(${1+.05*Math.sin(t*2)})`;
  P.forEach((p,i)=>{const y=((p.y-p.v*t)%3200+3200)%3200-100, x=p.x+35*Math.sin(t*1.2+p.ph);
    const e=$('p'+i); e.style.transform=`translate(${x}px,${y}px) rotate(${p.r+t*40}deg)`; e.style.opacity=p.a*cl(t/.8);});
  pop($('badge'),t,.2,{dy:-60});
  // station
  ['pl','pr'].forEach(id=>{$(id).style.opacity=cl((t-.2)/.6);});
  $('led').style.width=(1920*eo((t-.4)/1.4))+'px';
  $('led').style.filter=`brightness(${1+.4*Math.max(0,Math.sin(t*3))})`;
  // text
  pop($('l1'),t,1.0); pop($('l2'),t,2.6); pop($('l3'),t,3.0,{d:.8});
  $('l3').style.transform+=` scale(${1+.035*Math.max(0,Math.sin((t-4)*5))*cl(t-4)})`;
  pop($('l4'),t,5.0); pop($('l5'),t,5.5,{d:.8}); pop($('e1'),t,6.0,{dy:0}); $('e1').style.transform+=` scale(${1+.12*Math.max(0,Math.sin(t*7))})`;
  // character: rise in, breathe, hops at 3.4 and 7.6
  const rise=eo((t-.5)/.9), squash=1+.06*Math.sin(Math.PI*cl((t-1.2)/.35))*(t>1.2&&t<1.55?1:0);
  const bob=Math.sin(t*3.2)*8, br=1+.012*Math.sin(t*3.2);
  const hy=hop(t,3.4)+hop(t,7.6);
  $('char').style.opacity=cl((t-.5)/.3);
  $('char').style.transform=`translateY(${(1-rise)*1100+Math.abs(bob)+hy}px) scale(${br*(2-squash)},${br*squash}) rotate(${1.2*Math.sin(t*1.6)}deg)`;
  
  // wave: continuous from 1.0s, stronger at greeting
  const wa=cl((t-1.0)/.4), amp=7*(t<2.6?1:.7);
  $('arm').style.transform=`rotate(${wa*amp*Math.sin((t-1.0)*2*Math.PI*1.6)}deg)`;
  // motion marks near the hand during greeting
  [0,1,2].forEach(i=>{const e=$('w'+i), ph=(t*1.6+i*.33)%1; const on=t>1.1&&t<2.8;
    e.style.opacity=on? .8*Math.sin(Math.PI*ph):0;
    e.style.transform=`translate(${300-36*i}px,${4560+i*70}px) rotate(${-35+i*20}deg) scaleX(${.8+.8*ph})`;});
  // speech bubble with the first hop
  const bp=cl((t-3.4)/.6); $('bubble').style.opacity=cl((t-3.4)/.2);
  $('bubble').style.transform=`scale(${.3+.7*back(bp)}) rotate(${-4+3*Math.sin(t*4)}deg)`;
  // confetti with second hop
  const ct=t-7.6;
  C.forEach((c,i)=>{const e=$('c'+i); if(ct<0){e.style.opacity=0;return;}
    const x=c.x+c.vx*ct, y=c.y+c.vy*ct+1700*ct*ct; e.style.opacity=cl(1-(ct-1.6)/.5);
    e.style.transform=`translate(${x}px,${y}px) rotate(${c.rot+c.vr*ct}deg)`;});
}
window.render=render; render(0);
</script>
</body></html>
